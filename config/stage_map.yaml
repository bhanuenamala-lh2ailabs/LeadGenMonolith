# Native stage -> canonical stage map for the five reporting pipelines.  DATA, not code.  Keyed by (account, pipeline_id, stage_id):
# a label is never a key (labels collide across pipelines and were renamed; ids are what HubSpot stores in deal history).
#
# Built by hand from the LIVE pipeline definitions (GET /crm/v3/pipelines/deals, 2026-10-04, as stored in hsraw_object) and
#   docs/discovery/funnel-reports.md  section 4.2 "Canonical funnel ladder" + "Canonical dead taxonomy" + 4.5 per-portal rules
#   docs/discovery/companyops-pipelines-live.json (COMPANYOPS stage definitions)
#   config/canonical_stages.yaml (the ladder and dead reasons the codes below come from)
# `leadgen.hubspot.canonicalize` applies it to stage_map / stage_alias and FAILS LOUD (ops_dq_issue 'unmapped_stage', v_unmapped_stage,
# doctor warning) for any stage of a reporting pipeline that has no row here.  It also warns (info) when a live label no longer matches
# the `label` recorded here (renamed stage: the mapping by id still holds).
#
# Row fields
#   id / label     HubSpot stage id and the label it had when mapped (documentation + drift check)
#   canonical      a canonical_stage code (never a derived rung: MEETING_HELD and EVALUATED are computed from events)
#   kind           live | dead | won - redundant on purpose: checked against the canonical code at load time
#   dead_reason    canonical_dead_reason code, REQUIRED for DEAD stages
#   depth_reached  highest canonical depth the deal reached before dying (DEAD only; RETIRED_ADMIN needs none)
#   sub_row        native detail kept under a shared rung (CoOps ( Global ) Sample Extraction / Demand Fulfillment under NEGOTIATION)
#   flag_*         per-stage override of the effort flags (CoOps "Dead: Communicated / Wrong Fit" was already communicated: an attempt)
#
# DECISIONS the owner may want to flip (each is one line below):
#   1. "Call Attempted (retired)" (Coding 3992480464 and the old Campaign id) -> DEAD / RETIRED_ADMIN, following funnel-reports 4.5 and
#      config/canonical_stages.yaml.  funnel-reports 4.2 (ladder) and the SOP ("map historical Call Attempted to No Pickup for continuity")
#      would put it on NO_ANSWER instead.
#   2. CoOps ( Global ) "Communicated" -> REPLIED (rank 2), open question 1 in funnel-reports section 7.
#   3. "Retired: Callback +1 day" (both Clusters) -> NO_ANSWER (live), as the report rows already do.
#   4. Dead depth_reached: a no-show always implies a booked slot (4); quality deaths after an asset came back count as EVALUATED (8);
#      "died at <stage>" otherwise.
#
# NOT mapped on purpose (reported by canonicalize as unmapped, label unknown anywhere in the repo or the API):
#   COMPANYOPS / Cluster 2 stage ids 4080987862 and 4111134400 (125 events each, 2026-08-06/07, the retired Gmail cold-email branch:
#   created in the first, moved to the second, 124 of 125 then parked in "Dead: Email Campaign / Branch Retired"), 4080987867, 4080987868,
#   4111134403 (3 / 3 / 2 events between "One pager received" and "LOI signed": the v3 sample-evaluation stretch) and 4080987879
#   (1 event, Replied -> "Dead: Replied / Not Interested").  A human has to name them (funnel B-L4 in docs/review/schema-decisions.md).
version: 1

# The RAT stock pipeline (HubSpot's "Deals pipeline", 7 stock stages, 1 sample deal) is flagged non-reporting in config/accounts.yaml.
# Its stages are stored (the sample deal needs the FK) but need no mapping.
ignored_pipelines:
  - {account: rat, pipeline_id: "default", reason: "HubSpot stock pipeline holding one sample deal; ignored by every report"}

# Label renames HubSpot history / old docs still use (stage_alias kind 'label', lower-case).
